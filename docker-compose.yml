services:
  backend:
    build: ./backend
    container_name: culinary_backend
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: culinary_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_media: